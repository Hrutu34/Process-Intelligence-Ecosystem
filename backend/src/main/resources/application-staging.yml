spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pie_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  ai:
    ollama:
      chat:
        enabled: false
    google:
      genai:
        api-key: dummy_key_to_satisfy_client_init
        chat:
          enabled: false
    openai:
      api-key: ${GROQ_API_KEY:${LLMAAS_API_KEY:placeholder_key}}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        enabled: true
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: 0.1
          max-tokens: 4096