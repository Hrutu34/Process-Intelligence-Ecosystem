spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-20b}
          temperature: ${GROQ_TEMPERATURE:0.1}
          max-completion-tokens: ${GROQ_MAX_COMPLETION_TOKENS:4096}
          reasoning-effort: ${GROQ_REASONING_EFFORT:low}