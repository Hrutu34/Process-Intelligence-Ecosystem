spring:
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update

      spring:

# Google GenAI / Gemini Configuration (Active across all profiles)
spring.ai:
  google:
    genai:
      api-key: ${GEMINI_API_KEY:placeholder_key_if_not_set}
      chat:
        options:
          model: gemini-2.5-flash